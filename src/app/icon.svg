<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="32" height="32">
  <!-- Snaprint Mascot Favicon -->
  <!-- Two red feet -->
  <rect x="28" y="86" width="18" height="9" rx="4.5" fill="#E63946" />
  <rect x="54" y="86" width="18" height="9" rx="4.5" fill="#E63946" />

  <!-- Small grey arms -->
  <rect x="11" y="44" width="7" height="18" rx="3.5" fill="#888882" />
  <rect x="82" y="44" width="7" height="18" rx="3.5" fill="#888882" />

  <!-- Main body: near-black rounded rectangle -->
  <rect x="18" y="10" width="64" height="76" rx="16" fill="#0e0e0d" />

  <!-- Top red band -->
  <path d="M 18 26 L 18 22 C 18 15.37 23.37 10 30 10 L 70 10 C 76.63 10 82 15.37 82 22 L 82 26 Z" fill="#E63946" />

  <!-- Light face panel -->
  <rect x="25" y="30" width="50" height="36" rx="10" fill="#f5f5f3" />

  <!-- Two dark oval eyes -->
  <ellipse cx="38" cy="44" rx="3" ry="4" fill="#0e0e0d" />
  <ellipse cx="62" cy="44" rx="3" ry="4" fill="#0e0e0d" />

  <!-- Two small red cheeks -->
  <circle cx="33" cy="51" r="2.5" fill="#E63946" opacity="0.9" />
  <circle cx="67" cy="51" r="2.5" fill="#E63946" opacity="0.9" />

  <!-- Small curved smile -->
  <path d="M 44 50 Q 50 55 56 50" stroke="#0e0e0d" stroke-width="2.2" stroke-linecap="round" fill="none" />

  <!-- Kiosk paper dispensing slot accent -->
  <rect x="34" y="73" width="32" height="3" rx="1.5" fill="#3a3a37" />
</svg>
